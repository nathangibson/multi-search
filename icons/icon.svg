<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#4A90E2" rx="16"/>
  
  <!-- Magnifying glass -->
  <circle cx="50" cy="50" r="25" fill="none" stroke="white" stroke-width="6"/>
  <line x1="68" y1="68" x2="90" y2="90" stroke="white" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Multiple search lines (representing multiple sites) -->
  <g opacity="0.8">
    <line x1="35" y1="50" x2="65" y2="50" stroke="white" stroke-width="3"/>
    <line x1="35" y1="42" x2="55" y2="42" stroke="white" stroke-width="3"/>
    <line x1="35" y1="58" x2="60" y2="58" stroke="white" stroke-width="3"/>
  </g>
</svg>
