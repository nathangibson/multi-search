<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings – Bibliography Search</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div id="app">
    <h1>Settings – Multi-Site Search</h1>

    <div id="status-msg" hidden></div>

    <section class="mode-picker">
      <label for="mode-select">Mode</label>
      <select id="mode-select">
        <!-- Populated by settings.js -->
      </select>
      <div class="mode-actions">
        <button id="add-mode-btn" class="btn btn-secondary">+ Add Mode</button>
        <button id="rename-mode-btn" class="btn btn-secondary">Rename</button>
        <button id="delete-mode-btn" class="btn btn-danger">Delete Mode</button>
      </div>
    </section>

    <section id="mode-form" hidden>
      <h2 id="mode-form-title">Add Mode</h2>
      <form>
        <label for="mode-form-name">Mode Name</label>
        <input id="mode-form-name" type="text" placeholder="e.g. News" required>
        <input id="mode-form-id" type="hidden">
        <div class="form-actions">
          <button id="mode-form-save" type="button" class="btn btn-primary">Save</button>
          <button id="mode-form-cancel" type="button" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </section>

    <section>
      <h2>Sites</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Search Template</th>
            <th>Enabled</th>
            <th>Order</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="sites-tbody"></tbody>
      </table>
    </section>

    <div class="toolbar">
      <button id="add-btn" class="btn btn-primary">Add Site</button>
      <button id="export-btn" class="btn btn-secondary">Export JSON</button>
      <button id="import-btn" class="btn btn-secondary">Import JSON</button>
      <button id="reset-btn" class="btn btn-danger">Reset to Defaults</button>
    </div>

    <input type="file" id="import-file" accept=".json" hidden>

    <section class="groups-section">
      <h2>Groups</h2>
      <p class="section-hint">Groups let you select multiple sites at once in the sidebar. Sites can belong to more than one group.</p>
      <table id="groups-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Sites</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="groups-tbody"></tbody>
      </table>
      <div class="toolbar">
        <button id="add-group-btn" class="btn btn-primary">Add Group</button>
      </div>
    </section>

    <section id="group-form" hidden>
      <h2 id="group-form-title">Add Group</h2>
      <form>
        <label for="group-form-name">Group Name</label>
        <input id="group-form-name" type="text" placeholder="e.g. German Resources" required>
        <input id="group-form-id" type="hidden">

        <label>Sites in this group</label>
        <div id="group-form-sites" class="group-sites-picker"></div>

        <div class="form-actions">
          <button id="group-form-save" type="button" class="btn btn-primary">Save</button>
          <button id="group-form-cancel" type="button" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </section>

    <section id="site-form" hidden>
      <h2>Add / Edit Site</h2>
      <form>
        <label for="form-name">Site Name</label>
        <input id="form-name" type="text" placeholder="e.g. JSTOR" required>

        <label for="form-template">Search URL Template <small>(must contain <code>{query}</code>)</small></label>
        <div class="template-row">
          <input id="form-template" type="text" placeholder="https://example.com/search?q={query}" required>
          <button id="test-btn" type="button" class="btn btn-secondary">▶ Test</button>
        </div>

        <input id="form-id" type="hidden">

        <div class="form-actions">
          <button id="form-save" type="button" class="btn btn-primary">Save</button>
          <button id="form-cancel" type="button" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </section>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
